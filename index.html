<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Check</title>
<meta name="description" content="Which size is the better deal? Enter the prices and see.">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deal Check">
<style>
  :root {
    --bg: #f3f6f4;
    --card: #ffffff;
    --text: #17221c;
    --muted: #5d6b63;
    --line: #d5ddd8;
    --accent: #1f7a4d;
    --accent-soft: #e2f3e9;
    --field: #f7f9f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101613;
      --card: #19221d;
      --text: #eef4f0;
      --muted: #9aaba1;
      --line: #2d3a33;
      --accent: #3fbf7f;
      --accent-soft: #173326;
      --field: #121a16;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: 26px; }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .link {
    border: 0;
    background: none;
    color: var(--accent);
    font-weight: 600;
    padding: 8px 4px;
  }

  /* the one camera button: scan one tag or several in a row, one tap each */
  #scan {
    width: 100%;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1.5px solid var(--accent);
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    padding: 12px;
  }
  #scan svg { width: 24px; height: 24px; flex: none; }

  /* one card per size */
  #items { display: flex; flex-direction: column; gap: 10px; }
  .item {
    position: relative;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }
  .item.best { border-color: var(--accent); background: var(--accent-soft); }
  .item .badge {
    display: none;
    position: absolute;
    top: -11px;
    left: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .item.best .badge { display: block; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .field > label { display: contents; }
  .row { display: flex; gap: 6px; min-width: 0; }
  input, select {
    font: inherit;
    font-size: 22px; /* big, and 16px or more so iOS doesn't zoom in */
    color: var(--text);
    background: var(--field);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    min-width: 0;
    width: 100%;
  }
  select { font-size: 18px; width: auto; flex: none; padding: 8px 6px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .money { position: relative; }
  .money::before {
    content: "$";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    color: var(--muted);
    pointer-events: none;
  }
  .money input { padding-left: 24px; }
  /* a card whose tag picture is still being read */
  .item.reading .note::before {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 6px;
    vertical-align: -2px;
    border: 2px solid var(--accent);
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note {
    grid-column: 1 / -1;
    font-size: 15px;
    margin-top: -4px;
  }
  .note.warn { color: #b3541e; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .note.warn { color: #f0a46b; } }
  .note:empty { display: none; }
  .per {
    grid-column: 1 / -1;
    font-size: 15px;
    color: var(--muted);
    min-height: 1.35em;
  }
  .remove {
    position: absolute;
    top: 4px;
    right: 6px;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    padding: 4px 6px;
  }
  .item.removable { padding-top: 22px; }

  #add {
    margin-top: 10px;
    width: 100%;
    border: 2px dashed var(--line);
    background: none;
    color: var(--muted);
    border-radius: 14px;
    padding: 10px;
    font-weight: 600;
  }

  #result {
    margin-top: 16px;
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    border: 2px solid var(--line);
    min-height: 64px;
  }
  #result.win { border-color: var(--accent); }
  #result .headline { font-size: 22px; font-weight: 700; margin: 0; }
  #result .headline b { color: var(--accent); }
  #result .detail { margin: 6px 0 0; color: var(--muted); }
  #result .hint { margin: 0; color: var(--muted); }

  /* the in-app camera: the live view, a box to fit the tag in, tap anywhere to take it */
  #viewfinder {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    color: #fff;
    overflow: hidden;
    touch-action: none;
  }
  #viewfinder[hidden] { display: none; }
  #viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #viewfinder .frame {
    position: absolute;
    left: 7%;
    width: 86%;
    top: 42%;
    transform: translateY(-50%);
    aspect-ratio: 4 / 3;
    border: 3px solid #fff;
    border-radius: 14px;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }
  #viewfinder .hint {
    position: absolute;
    left: 52px;
    right: 52px;
    top: max(16px, env(safe-area-inset-top));
    margin: 0;
    text-align: center;
    font-weight: 600;
    text-shadow: 0 1px 3px #000;
    pointer-events: none;
  }
  #viewfinder .shutter {
    position: absolute;
    left: 50%;
    bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 5px solid #fff;
    background: rgba(255, 255, 255, 0.35);
    padding: 0;
  }
  #viewfinder .close {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    right: 8px;
    border: 0;
    background: none;
    color: #fff;
    font-size: 34px;
    line-height: 1;
    padding: 8px 12px;
    text-shadow: 0 1px 3px #000;
  }
  #viewfinder .other {
    position: absolute;
    left: 12px;
    bottom: max(46px, calc(env(safe-area-inset-bottom) + 18px));
    border: 0;
    background: none;
    color: #fff;
    font-size: 15px;
    text-decoration: underline;
    padding: 8px 4px;
    text-shadow: 0 1px 3px #000;
  }
  #viewfinder .done {
    position: absolute;
    right: 12px;
    bottom: max(40px, calc(env(safe-area-inset-bottom) + 12px));
    border: 2px solid #fff;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    padding: 10px 18px;
  }
  #viewfinder .frame.flash { animation: flash 0.35s ease-out; }
  @keyframes flash { from { background: rgba(255, 255, 255, 0.75); } to { background: transparent; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Deal Check</h1>
    <button class="link" id="reset" type="button">Reset</button>
  </header>
  <button id="scan" type="button"></button>
  <div id="items"></div>
  <button id="add" type="button">+ Add another size</button>
  <section id="result" aria-live="polite"></section>
  <input type="file" id="camera" accept="image/*" capture="environment" hidden>
</main>
<div id="viewfinder" hidden>
  <video playsinline muted autoplay></video>
  <div class="frame"></div>
  <p class="hint">Starting the camera…</p>
  <button class="close" type="button" aria-label="Close the camera">×</button>
  <button class="shutter" type="button" aria-label="Take the picture"></button>
  <button class="other" type="button">Phone camera</button>
  <button class="done" type="button">Done</button>
</div>
<script>
// Each unit as a multiple of its kind's base unit: mL for volume, g for weight, 1 for a count.
const UNITS = {
  mL: { kind: "volume", base: 1 },
  L: { kind: "volume", base: 1000 },
  "fl oz": { kind: "volume", base: 29.5735 },
  gal: { kind: "volume", base: 3785.41 },
  g: { kind: "weight", base: 1 },
  kg: { kind: "weight", base: 1000 },
  oz: { kind: "weight", base: 28.3495 },
  lb: { kind: "weight", base: 453.592 },
  ct: { kind: "count", base: 1 },
};
// What "price per" is shown in for each kind.
const PER = { volume: "fl oz", weight: "oz", count: "ct" };
const DEFAULTS = [
  { size: "750", unit: "mL" },
  { size: "1.75", unit: "L" },
];
const MAX_ITEMS = 4;
// Reads a photo of a shelf tag (see worker/). Typing always works too.
const SCAN_URL = "https://deal-check-scan.deal-check-scan.workers.dev";
const CAMERA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>`;

const itemsEl = document.getElementById("items");
const resultEl = document.getElementById("result");
const addButton = document.getElementById("add");

/** A typed number ("$24.99", "1,000", ".75"), or NaN. */
function num(text) {
  const n = parseFloat(String(text).replace(/[$,\s]/g, ""));
  return n > 0 ? n : NaN;
}

function money(n) {
  return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
}

/** Unit prices can be a few cents, so show a third decimal when they're small. */
function unitMoney(n) {
  return "$" + n.toFixed(n < 1 ? 3 : 2);
}

function sizeText(size, unit) {
  return `${size} ${unit}`;
}

let itemCount = 0;

function addItem({ size, unit }, focus = false) {
  const n = ++itemCount;
  const item = document.createElement("div");
  item.className = "item";
  item.cid = n; // the number a scanned card goes by when spotting a second picture of the same item
  item.innerHTML = `
    <div class="badge">BEST DEAL</div>
    <div class="field"><label for="price-${n}"><span>Price</span></label>
      <div class="money"><input class="price" id="price-${n}" inputmode="decimal" autocomplete="off" placeholder="0.00"></div>
    </div>
    <label class="field"><span>Size</span>
      <div class="row">
        <input class="size" inputmode="decimal" autocomplete="off">
        <select class="unit" aria-label="Unit">${Object.keys(UNITS).map((u) => `<option>${u}</option>`).join("")}</select>
      </div>
    </label>
    <div class="per"></div>
    <div class="note" aria-live="polite"></div>`;
  item.querySelector(".size").value = size;
  item.querySelector(".unit").value = unit;
  itemsEl.append(item);
  syncItems();
  if (focus) item.querySelector(".price").focus();
}

/** Every card can be removed (the last two are emptied instead), and there's a limit to how many. */
function syncItems() {
  for (const item of itemsEl.children) {
    item.classList.add("removable");
    if (!item.querySelector(".remove")) {
      const x = document.createElement("button");
      x.className = "remove";
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", "Remove this one");
      item.append(x);
    }
  }
  addButton.hidden = itemsEl.children.length >= MAX_ITEMS;
  compare();
}

function compare() {
  const items = [...itemsEl.children].map((el) => {
    const price = num(el.querySelector(".price").value);
    const sizeRaw = el.querySelector(".size").value.trim();
    const size = num(sizeRaw);
    const unit = el.querySelector(".unit").value;
    const { kind, base } = UNITS[unit];
    const amount = size * base; // in the base unit
    return { el, price, size, sizeRaw, unit, kind, amount, perBase: price / amount };
  });

  // each card's own price per unit
  for (const it of items) {
    it.el.classList.remove("best");
    const per = it.el.querySelector(".per");
    per.textContent = Number.isFinite(it.perBase)
      ? `${unitMoney(it.perBase * UNITS[PER[it.kind]].base)} per ${PER[it.kind]}`
      : "";
  }

  const ready = items.filter((it) => Number.isFinite(it.perBase));
  resultEl.className = "";
  if (ready.length < 2) {
    resultEl.innerHTML = `<p class="hint">Enter ${ready.length ? "another" : "the"} price${ready.length ? "" : "s"} to see which is the better deal.</p>`;
    return;
  }
  // Grocery tags print "OZ" on drinks too, so when ounces meet a volume, count them as fluid ounces.
  let ozAsFlOz = "";
  if (ready.some((it) => it.unit === "oz") && ready.some((it) => it.kind === "volume")
      && ready.every((it) => it.kind === "volume" || it.unit === "oz")) {
    for (const it of ready.filter((it) => it.unit === "oz")) {
      it.kind = "volume";
      it.amount = it.size * UNITS["fl oz"].base;
      it.perBase = it.price / it.amount;
    }
    ozAsFlOz = " Counting oz as fl oz.";
  }
  if (new Set(ready.map((it) => it.kind)).size > 1) {
    resultEl.innerHTML = `<p class="hint">Those can't be compared: pick all volume, all weight, or all counts.</p>`;
    return;
  }

  // name each by its size, unless two are the same size
  const names = ready.map((it) => sizeText(it.sizeRaw, it.unit));
  const label = (it) => {
    const name = sizeText(it.sizeRaw, it.unit);
    return names.filter((n) => n === name).length > 1 ? `the ${money(it.price)} ${name}` : `the ${name}`;
  };

  const sorted = [...ready].sort((a, b) => a.perBase - b.perBase);
  const [best, next] = sorted;
  const cheaper = 1 - best.perBase / next.perBase;
  if (cheaper < 0.005) {
    resultEl.innerHTML = `<p class="headline">It's a wash.</p>
      <p class="detail">They cost about the same per ${PER[best.kind]}, so buy whichever size you'll use.${ozAsFlOz}</p>`;
    return;
  }
  best.el.classList.add("best");
  resultEl.className = "win";
  // what the same amount as the best one would cost at the runner-up's rate
  const sameAmount = next.perBase * best.amount;
  const save = sameAmount - best.price;
  const pct = Math.round(cheaper * 100) || "<1";
  resultEl.innerHTML = `<p class="headline"><b>${cap(label(best))}</b> is the better deal, ${pct}% cheaper.</p>
    <p class="detail">${cap(sizeText(best.sizeRaw, best.unit))} at ${label(next)} price would cost ${money(sameAmount)}. You save ${money(save)}.${ozAsFlOz}</p>`;
}

function cap(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function reset() {
  itemsEl.innerHTML = "";
  for (const d of DEFAULTS) addItem(d);
}

// typing over a scanned value clears its note
const edited = (e) => {
  const item = e.target.closest(".item");
  if (item) item.scan = null;
  setNote(item, "");
  compare();
};
itemsEl.addEventListener("input", edited);
itemsEl.addEventListener("change", edited);
itemsEl.addEventListener("click", (e) => {
  const x = e.target.closest(".remove");
  if (x) dropCard(x.closest(".item"));
});

/** Takes a card away, or empties it when only two are left. A reading on its way to it is dropped. */
function dropCard(item) {
  if (itemsEl.children.length > 2) {
    item.remove();
    syncItems();
    return;
  }
  item.querySelector(".price").value = "";
  item.querySelector(".size").value = "";
  item.readId = (item.readId || 0) + 1;
  item.classList.remove("reading");
  item.scan = null;
  setNote(item, "");
  compare();
}
// select the whole price when tapping in, so typing replaces it
itemsEl.addEventListener("focusin", (e) => {
  if (e.target.matches("input")) e.target.select();
});
addButton.addEventListener("click", () => {
  const last = itemsEl.lastElementChild;
  addItem({ size: "", unit: last ? last.querySelector(".unit").value : "mL" }, true);
});
document.getElementById("reset").addEventListener("click", reset);

// --- Scanning shelf tags ---
// One button. The camera opens inside the app and stays open: each tap reads the tag in the box
// into the next card (no confirm screen; only the box is sent) until "Done". If the browser can't
// do that or the camera is refused, it falls back to the phone's own camera app (the hidden file
// input), one tag per press.
// Where a scan starts: if some cards have a price and some don't, it fills the ones without
// (redo a bad read, or type one and scan the other). Otherwise it's a new comparison.
const camera = document.getElementById("camera");
const viewfinder = document.getElementById("viewfinder");
const video = viewfinder.querySelector("video");
const frame = viewfinder.querySelector(".frame");
const vfHint = viewfinder.querySelector(".hint");
// Pictures go out at up to 1568 px on the long side (11/13: Thomas got worse reads at 1000 px).
const MAX_SIDE = 1568;
let liveCamera = !!navigator.mediaDevices?.getUserMedia;
let multi = null; // while the in-app camera is open: { taken, last }
let phoneLater = false; // the phone-camera photo follows tags already taken in this scan
let stream = null;
const scanButton = document.getElementById("scan");
scanButton.innerHTML = `${CAMERA}<span>Scan tags</span>`;

scanButton.addEventListener("click", () => {
  if (liveCamera) openViewfinder();
  else phoneCamera(false);
});

/** No price yet, no picture on its way, and not a sale sign waiting for its shelf tag. */
function isBlank(el) {
  return !el.querySelector(".price").value.trim() && !el.classList.contains("reading") && !el.scan;
}

/**
 * The card for the first tag of a scan. Some cards priced and some not: the first one without.
 * All priced, or none: a new comparison.
 */
function firstTarget() {
  const cards = [...itemsEl.children];
  const blank = cards.filter(isBlank);
  if (blank.length && blank.length < cards.length) return blank[0];
  clearCards();
  return itemsEl.firstElementChild;
}

/** The card for a later tag in the same scan: the next without a price, a new one, or null when full. */
function laterTarget() {
  const blank = [...itemsEl.children].find(isBlank);
  if (blank) return blank;
  if (itemsEl.children.length >= MAX_ITEMS) return null;
  addItem({ size: "", unit: itemsEl.lastElementChild.querySelector(".unit").value });
  return itemsEl.lastElementChild;
}

/** A new comparison: back to two blank cards (units kept). Readings still on their way are dropped. */
function clearCards() {
  while (itemsEl.children.length > 2) itemsEl.lastElementChild.remove();
  for (const el of itemsEl.children) {
    el.querySelector(".price").value = "";
    el.querySelector(".size").value = "";
    el.readId = (el.readId || 0) + 1;
    el.classList.remove("reading");
    el.scan = null;
    setNote(el, "");
  }
  syncItems();
}

function readyHint() {
  return `Tag ${multi.taken + 1}: fit it in the box, then tap`;
}

function phoneCamera(later) {
  phoneLater = later;
  camera.value = "";
  camera.click();
}

async function openViewfinder() {
  multi = { taken: 0, last: 0 };
  viewfinder.hidden = false;
  viewfinder.classList.remove("ready");
  vfHint.textContent = "Starting the camera…";
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } },
    });
    if (viewfinder.hidden) {
      // closed while it was starting
      s.getTracks().forEach((t) => t.stop());
      return;
    }
    stream = s;
    video.srcObject = s;
    await video.play();
    viewfinder.classList.add("ready");
    vfHint.textContent = readyHint();
  } catch {
    if (viewfinder.hidden) return; // closed while it was starting
    // no camera access: use the phone's camera app from now on
    closeViewfinder();
    liveCamera = false;
    phoneCamera(false);
  }
}

function closeViewfinder() {
  viewfinder.hidden = true;
  multi = null;
  viewfinder.classList.remove("ready");
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
}

/** Takes the part of the live view inside the box (plus a margin) and reads it. */
function snap() {
  const canvas = grabBox();
  if (canvas) takeNext(canvas);
}

/** Read this tag into the next card and keep the camera open for the next one. */
function takeNext(canvas) {
  const now = Date.now();
  if (now - multi.last < 700) return; // a double tap isn't two tags
  multi.last = now;
  const item = multi.taken === 0 ? firstTarget() : laterTarget();
  if (!item) {
    closeViewfinder();
    return;
  }
  multi.taken++;
  item.classList.add("reading"); // taken, so the next tag goes to another card
  canvas.toBlob((b) => readPhoto(item, b), "image/jpeg", 0.85);
  // nowhere left to put another tag: close
  if (itemsEl.children.length >= MAX_ITEMS && ![...itemsEl.children].some(isBlank)) {
    closeViewfinder();
    return;
  }
  frame.classList.remove("flash");
  void frame.offsetWidth; // restart the flash
  frame.classList.add("flash");
  navigator.vibrate?.(40);
  vfHint.textContent = `Got it. ${readyHint()}`;
}

/** The part of the live view inside the box (plus a margin), as a canvas, or null if not ready. */
function grabBox() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!viewfinder.classList.contains("ready") || !vw || !vh) return null;
  // the video fills the screen (object-fit: cover), so map the box from screen to video pixels
  const v = video.getBoundingClientRect();
  const f = frame.getBoundingClientRect();
  const scale = Math.max(v.width / vw, v.height / vh);
  const offX = (v.width - vw * scale) / 2;
  const offY = (v.height - vh * scale) / 2;
  const pad = f.width * 0.08;
  const sx = Math.max(0, (f.left - pad - v.left - offX) / scale);
  const sy = Math.max(0, (f.top - pad - v.top - offY) / scale);
  const sw = Math.min(vw - sx, (f.width + 2 * pad) / scale);
  const sh = Math.min(vh - sy, (f.height + 2 * pad) / scale);
  const s = Math.min(1, MAX_SIDE / Math.max(sw, sh));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(sw * s);
  canvas.height = Math.round(sh * s);
  canvas.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas;
}

viewfinder.addEventListener("click", (e) => {
  if (e.target.closest(".close, .done")) closeViewfinder();
  else if (e.target.closest(".other")) {
    const later = multi?.taken > 0;
    closeViewfinder();
    phoneCamera(later);
  } else snap();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !viewfinder.hidden) closeViewfinder();
});
// don't leave the camera running if the app is switched away from
document.addEventListener("visibilitychange", () => {
  if (document.hidden && !viewfinder.hidden) closeViewfinder();
});

function setNote(item, text, warn = false) {
  if (!item) return;
  const note = item.querySelector(".note");
  note.textContent = text;
  note.classList.toggle("warn", warn);
}

/** A phone-camera photo, shrunk to at most MAX_SIDE px on its long side, as a JPEG. */
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return await new Promise((ok, fail) =>
      canvas.toBlob((b) => (b ? ok(b) : fail(new Error("toBlob"))), "image/jpeg", 0.85));
  } finally {
    URL.revokeObjectURL(url);
  }
}

const SCAN_ERRORS = {
  busy: "Too many pictures at once. Wait a minute and try again.",
  cap: "Picture reading is off for today. Type the numbers instead.",
};

function trimNum(n) {
  return String(Math.round(n * 1000) / 1000);
}

camera.addEventListener("change", () => {
  const file = camera.files[0];
  if (file) readPhoto((phoneLater && laterTarget()) || firstTarget(), file);
});

// Readings go out one at a time, so each one is told what's already been scanned and the reader
// can spot a second picture of the same item (its sale sign, its shelf tag, or the same tag again).
let readLine = Promise.resolve();
function inLine(job) {
  const p = readLine.then(job);
  readLine = p.catch(() => {});
  return p;
}

const SCAN_KEYS = ["product", "price", "regular", "size", "unit", "buy", "deal", "note", "check"];

/** The cards already scanned in this comparison, as the reader is told about them. */
function scannedCards(except) {
  return [...itemsEl.children]
    .filter((el) => el !== except && el.scan)
    .map((el) => ({ n: el.cid, ...el.scan }));
}

/** Sends a picture of a tag (a Blob, or a File from the phone camera) and fills in the card. */
async function readPhoto(item, picture) {
  if (!item) return;
  // a newer reading for this card, or a new comparison, drops this one
  const id = (item.readId = (item.readId || 0) + 1);
  const mine = () => item.isConnected && item.readId === id;
  item.classList.add("reading");
  item.scan = null;
  try {
    if (!picture || !item.isConnected) return;
    if (!navigator.onLine) {
      setNote(item, "No signal right now. Type the numbers instead.", true);
      return;
    }
    setNote(item, "Reading the tag…");
    const photo = picture instanceof File ? await shrink(picture) : picture;
    await inLine(async () => {
      if (!mine()) return;
      const cards = scannedCards(item);
      // always sent (even empty): it tells the reader this app understands sale signs and pairing
      const url = `${SCAN_URL}?cards=${encodeURIComponent(JSON.stringify(cards))}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "image/jpeg" },
        body: photo,
        signal: AbortSignal.timeout(30000),
      });
      const data = await res.json().catch(() => ({}));
      if (!mine()) return;
      if (!res.ok) {
        setNote(item, SCAN_ERRORS[data.error] || "Couldn't read that one. Try again, or type the numbers.", true);
        return;
      }
      if (!data.found) {
        setNote(item, "Couldn't find a price in that picture. Get closer to the tag and try again.", true);
        return;
      }
      // the same item as a card already scanned: put the two together there and let this card go
      const twin = data.same && [...itemsEl.children].find((el) => el.cid === data.same && el !== item);
      if (twin) {
        const paired = twin.scan?.deal || data.own?.deal;
        fill(twin, data, paired ? "Put together with its sale sign." : "Same tag as before, so it's kept as one.");
        dropCard(item);
      } else fill(item, data.own ?? data);
    });
  } catch {
    if (mine()) setNote(item, "Couldn't reach the tag reader. Try again, or type the numbers.", true);
  } finally {
    if (item.readId === id) item.classList.remove("reading");
  }
}

/** Fills a card from a reading and says what happened under it. */
function fill(item, data, lead = "") {
  item.scan = Object.fromEntries(SCAN_KEYS.map((k) => [k, data[k] ?? null]));
  item.querySelector(".price").value = data.price ? data.price.toFixed(2) : "";
  if (data.size && UNITS[data.unit]) {
    item.querySelector(".size").value = trimNum(data.size);
    item.querySelector(".unit").value = data.unit;
  }
  compare();
  const parts = lead ? [lead] : [];
  if (data.note) parts.push(cap(data.note) + ".");
  if (!data.price) {
    // a sale sign with only the deal on it ("Buy 1 Get 1 Free", "Save $1")
    parts.push("Now scan this item's regular shelf tag, or type its price.");
    setNote(item, parts.join(" "));
    return;
  }
  if (data.buy) parts.push(`That's the price each if you buy ${data.buy}.`);
  if (!data.size) parts.push("Couldn't read the size; type it in.");
  else if (data.check === "estimated") parts.push("Size worked out from the tag's unit price.");
  const warn = data.check === "mismatch" || !data.size;
  if (data.check === "mismatch") parts.push("Check these: they don't match the tag's unit price.");
  setNote(item, parts.join(" ") || "Read from the tag. Check it looks right.", warn);
}

reset();

// works offline once it's been opened (see sw.js)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
